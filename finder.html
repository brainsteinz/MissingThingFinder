<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Finder Cloud | Lost & Found</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-emerald-600 text-white p-6 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold"><i class="fas fa-cloud mr-2"></i>Campus Finder Online</h1>
                <p class="text-emerald-100 text-sm">Terhubung ke seluruh mahasiswa</p>
            </div>
            <button onclick="openModal()" class="bg-white text-emerald-600 px-5 py-2 rounded-full font-bold hover:shadow-lg transition-all active:scale-95">
                <i class="fas fa-plus mr-2"></i>Buat Laporan
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div id="filterContainer" class="flex flex-wrap gap-2 mb-8 justify-center">
            <button onclick="setFilter('Semua')" class="filter-btn bg-emerald-600 text-white px-4 py-2 rounded-full text-sm font-semibold shadow-sm">Semua</button>
            <button onclick="setFilter('Elektronik')" class="filter-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm">Elektronik</button>
            <button onclick="setFilter('Dokumen')" class="filter-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm">Dokumen</button>
            <button onclick="setFilter('Kunci')" class="filter-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm">Kunci</button>
            <button onclick="setFilter('Lainnya')" class="filter-btn bg-white text-gray-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm">Lainnya</button>
        </div>

        <div id="reportList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-gray-400">Menghubungkan ke Cloud...</div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="bg-emerald-600 p-5 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg">Detail Laporan Online</h3>
                <button onclick="closeModal()"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <select id="statusInput" class="w-full p-3 bg-gray-50 border rounded-xl outline-none">
                    <option value="Hilang">Barang Hilang</option>
                    <option value="Temuan">Barang Temuan</option>
                </select>
                
                <div class="grid grid-cols-2 gap-4">
                    <select id="categoryInput" class="p-3 bg-gray-50 border rounded-xl outline-none">
                        <option value="Elektronik">Elektronik</option>
                        <option value="Dokumen">Dokumen</option>
                        <option value="Kunci">Kunci</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                    <input type="text" id="itemName" class="p-3 bg-gray-50 border rounded-xl outline-none" placeholder="Nama Barang">
                </div>
                
                <input type="text" id="location" class="w-full p-3 bg-gray-50 border rounded-xl outline-none" placeholder="Lokasi">
                
                <input type="text" id="contact" class="w-full p-3 bg-gray-50 border rounded-xl outline-none" placeholder="Kontak (WA/IG)">
                
                <button onclick="submitReport()" class="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl hover:bg-emerald-700 transition-colors">
                    Kirim ke Cloud
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        /**
         * Mengimpor Library Firebase dari CDN menggunakan format ES Modules (type="module")
         * - initializeApp: Memulai koneksi aplikasi dengan project Firebase Anda.
         * - getFirestore: Memberikan akses ke database Firestore (NoSQL).
         * - collection, addDoc, doc: Fungsi untuk navigasi dan manipulasi data (tambah/hapus).
         * - onSnapshot: Fungsi 'Ajaib' yang mendengarkan perubahan data secara Real-Time.
         */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi Spesifik Project Firebase (ID Unik yang menghubungkan kode ke Dashboard Firebase Anda)
        const firebaseConfig = {
          apiKey: "AIzaSyAZdhcvWrqtW3E_3Hc5s7cVF7JqWmxsURY",
          authDomain: "missingfinderrr.firebaseapp.com",
          projectId: "missingfinderrr",
          storageBucket: "missingfinderrr.firebasestorage.app",
          messagingSenderId: "360364297487",
          appId: "1:360364297487:web:eeee10b5ac2be5b837c27a"
        };

        // Memulai aplikasi dan mendapatkan referensi database
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        // colRef: Referensi ke tabel/koleksi bernama "reports" di Cloud Firestore
        const colRef = collection(db, "reports"); 

        // State Global: Menyimpan kategori filter yang sedang aktif
        let currentFilter = 'Semua';

        /**
         * 1. FUNGSI PENYADAP DATA (REAL-TIME LISTENER)
         * Fungsi ini berjalan otomatis setiap kali ada data yang BERTAMBAH, BERUBAH, atau DIHAPUS di Cloud.
         */
        // query & orderBy: Menyusun data agar yang terbaru (createdAt) muncul di atas (desc)
        const q = query(colRef, orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            let reports = [];
            // Melakukan looping pada setiap dokumen yang ada di Firebase
            snapshot.docs.forEach(doc => {
                // Menggabungkan data isi dokumen dengan ID dokumen tersebut
                reports.push({ ...doc.data(), id: doc.id });
            });
            // window.allReports: Menyimpan salinan data ke objek window agar bisa diakses oleh fungsi filter di luar scope module
            window.allReports = reports; 
            renderDisplay(reports);
        });

        /**
         * 2. FUNGSI RENDER (UI GENERATOR)
         * Mengubah array data dari Firebase menjadi elemen visual (HTML) di layar.
         */
        window.renderDisplay = (data) => {
            const listElement = document.getElementById('reportList');
            listElement.innerHTML = ''; // Membersihkan list lama sebelum merender yang baru
            
            // Logika Penyaringan (Filtering) Client-side
            const filtered = currentFilter === 'Semua' ? data : data.filter(r => r.category === currentFilter);

            // Membangun elemen kartu untuk setiap item laporan
            filtered.forEach(report => {
                const isHilang = report.status === 'Hilang';
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-all animate-fade-in";
                
                // Template Literal HTML: Memasukkan data Firebase ke dalam struktur kartu
                card.innerHTML = `
                    <div class="h-2 ${isHilang ? 'bg-orange-400' : 'bg-blue-400'}"></div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-[10px] font-bold px-2 py-1 rounded-md ${isHilang ? 'bg-orange-100 text-orange-600' : 'bg-blue-100 text-blue-600'}">${report.status}</span>
                            <span class="text-[10px] text-gray-400 bg-gray-50 px-2 py-1 rounded">${report.category}</span>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-2 capitalize">${report.name}</h3>
                        <p class="text-xs text-gray-500"><i class="fas fa-map-marker-alt mr-2 text-emerald-500"></i>${report.location}</p>
                        <div class="pt-3 mt-4 border-t flex justify-between items-center">
                            <span class="text-sm font-bold text-emerald-600">${report.contact}</span>
                            <button onclick="deleteReport('${report.id}')" title="Tandai Selesai" class="text-gray-300 hover:text-red-500 transition-colors">
                                <i class="fas fa-check-circle text-xl"></i>
                            </button>
                        </div>
                    </div>`;
                listElement.appendChild(card);
            });
        };

        /**
         * 3. FUNGSI KIRIM DATA (UPLOAD TO CLOUD)
         * Mengambil input dari user dan mengunggahnya sebagai dokumen baru ke Firestore.
         */
        window.submitReport = async () => {
            // Membuat objek laporan berdasarkan input form
            const data = {
                status: document.getElementById('statusInput').value,
                category: document.getElementById('categoryInput').value,
                name: document.getElementById('itemName').value,
                location: document.getElementById('location').value,
                contact: document.getElementById('contact').value,
                createdAt: new Date() // Timestamp sangat krusial untuk pengurutan data
            };

            // Validasi sederhana: Mencegah input kosong
            if(!data.name || !data.location) return alert("Mohon isi nama barang dan lokasi!");

            try {
                // addDoc: Fungsi Firebase untuk menambahkan data baru ke koleksi secara asinkron
                await addDoc(colRef, data); 
                closeModal(); // Menutup form jika berhasil
                alert("Laporan berhasil dipublikasikan ke seluruh kampus!");
                resetForm();  // Mengosongkan field form
            } catch (err) {
                console.error("Firebase Error:", err);
                alert("Gagal mengirim laporan. Pastikan koneksi internet stabil.");
            }
        };

        /**
         * 4. FUNGSI HAPUS DATA (FINISHING)
         * Menghapus dokumen dari Cloud berdasarkan ID uniknya.
         */
        window.deleteReport = async (id) => {
            // Konfirmasi keamanan agar tidak terjadi penghapusan tidak sengaja
            if(confirm("Apakah barang ini sudah benar-benar ditemukan/selesai? Laporan akan dihapus permanen.")) {
                try {
                    // doc & deleteDoc: Menunjuk alamat dokumen spesifik lalu menghapusnya
                    const docRef = doc(db, "reports", id);
                    await deleteDoc(docRef); 
                    // Tidak perlu panggil render ulang, karena onSnapshot akan mendeteksi penghapusan secara otomatis
                } catch (err) {
                    alert("Gagal menghapus laporan.");
                }
            }
        };

        /**
         * 5. LOGIKA FILTER UI
         * Menangani perubahan tampilan tombol filter dan memperbarui list data.
         */
        window.setFilter = (cat) => {
            currentFilter = cat;
            
            // Mengubah style tombol filter (Aktif vs Tidak Aktif)
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.classList.replace('bg-white', 'bg-emerald-600');
                    btn.classList.replace('text-gray-600', 'text-white');
                } else {
                    btn.classList.replace('bg-emerald-600', 'bg-white');
                    btn.classList.replace('text-white', 'text-gray-600');
                }
            });
            // Merender ulang data dari variabel global berdasarkan filter baru
            renderDisplay(window.allReports);
        };

        // Fungsi pembantu untuk mereset form setelah input
        function resetForm() {
            document.getElementById('itemName').value = '';
            document.getElementById('location').value = '';
            document.getElementById('contact').value = '';
        }
    </script>

    <script>
        // Fungsi untuk menampilkan Modal dengan menghapus class 'hidden'
        function openModal() { 
            document.getElementById('modal').classList.remove('hidden'); 
        }

        // Fungsi untuk menyembunyikan Modal dengan menambah class 'hidden'
        function closeModal() { 
            document.getElementById('modal').classList.add('hidden'); 
        }
    </script>
</body>
</html>
